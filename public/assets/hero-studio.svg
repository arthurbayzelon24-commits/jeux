<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-label="Illustration du studio SOLVEX : aperçu, timeline et outils de création">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1B6E"/><stop offset=".55" stop-color="#4263FF"/><stop offset="1" stop-color="#45E5F5"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3A8"/><stop offset="1" stop-color="#FF8A5C"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1450"/><stop offset="1" stop-color="#3B2A8F"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0F2E"/><stop offset="1" stop-color="#1F1A5C"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45E5F5"/><stop offset=".5" stop-color="#4263FF"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151C3D"/><stop offset="1" stop-color="#0C1124"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4263FF" stop-opacity=".45"/><stop offset="1" stop-color="#4263FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect x="70" y="62" width="380" height="214" rx="10"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <ellipse cx="300" cy="230" rx="300" ry="200" fill="url(#glow)"/>

  <!-- editor window -->
  <rect x="40" y="30" width="520" height="400" rx="22" fill="url(#panel)" stroke="url(#frame)" stroke-opacity=".55" stroke-width="1.5"/>
  <circle cx="64" cy="48" r="4" fill="#FF5C7A"/><circle cx="78" cy="48" r="4" fill="#FFB547"/><circle cx="92" cy="48" r="4" fill="#3DDC97"/>

  <!-- preview scene -->
  <g clip-path="url(#screen)">
    <rect x="70" y="62" width="380" height="214" fill="url(#sky)"/>
    <circle cx="330" cy="170" r="44" fill="url(#sun)"/>
    <path d="M70 230 Q150 150 230 210 T390 190 T450 205 V276 H70Z" fill="url(#hill1)"/>
    <path d="M70 255 Q170 205 260 245 T450 240 V276 H70Z" fill="url(#hill2)"/>
    <text x="96" y="110" font-family="Inter, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#F5F7FF" letter-spacing="2">VOTRE HISTOIRE</text>
    <rect x="96" y="120" width="120" height="4" rx="2" fill="#45E5F5"/>
  </g>
  <rect x="70" y="62" width="380" height="214" rx="10" fill="none" stroke="#F5F7FF" stroke-opacity=".12"/>

  <!-- side properties panel -->
  <rect x="466" y="62" width="78" height="214" rx="10" fill="#0A0E1F" stroke="#8294FF" stroke-opacity=".18"/>
  <g fill="#8294FF" fill-opacity=".35">
    <rect x="478" y="78" width="54" height="6" rx="3"/>
    <rect x="478" y="100" width="40" height="4" rx="2"/>
  </g>
  <rect x="478" y="112" width="54" height="4" rx="2" fill="#23295A"/><rect x="478" y="112" width="34" height="4" rx="2" fill="#4263FF"/>
  <rect x="478" y="132" width="54" height="4" rx="2" fill="#23295A"/><rect x="478" y="132" width="20" height="4" rx="2" fill="#8B5CF6"/>
  <rect x="478" y="152" width="54" height="4" rx="2" fill="#23295A"/><rect x="478" y="152" width="44" height="4" rx="2" fill="#45E5F5"/>
  <rect x="478" y="176" width="54" height="22" rx="7" fill="#4263FF" fill-opacity=".35" stroke="#4263FF"/>

  <!-- transport -->
  <circle cx="260" cy="296" r="11" fill="#4263FF"/>
  <path d="M256 290 L266 296 L256 302Z" fill="#F5F7FF"/>
  <rect x="96" y="294" width="130" height="4" rx="2" fill="#23295A"/><rect x="96" y="294" width="62" height="4" rx="2" fill="#45E5F5"/>

  <!-- timeline -->
  <rect x="58" y="318" width="486" height="96" rx="12" fill="#090D1B" stroke="#8294FF" stroke-opacity=".15"/>
  <g font-family="ui-monospace, monospace" font-size="8" fill="#6C779D">
    <text x="70" y="332">00:00</text><text x="170" y="332">00:05</text><text x="270" y="332">00:10</text><text x="370" y="332">00:15</text><text x="470" y="332">00:20</text>
  </g>
  <rect x="70" y="340" width="96" height="16" rx="5" fill="#8B5CF6" fill-opacity=".55" stroke="#8B5CF6"/>
  <rect x="196" y="340" width="70" height="16" rx="5" fill="#FF5CA8" fill-opacity=".4" stroke="#FF5CA8"/>
  <rect x="70" y="362" width="150" height="20" rx="5" fill="#4263FF" fill-opacity=".55" stroke="#4263FF"/>
  <rect x="222" y="362" width="120" height="20" rx="5" fill="#4263FF" fill-opacity=".45" stroke="#7FA2FF"/>
  <rect x="344" y="362" width="170" height="20" rx="5" fill="#4263FF" fill-opacity=".55" stroke="#4263FF"/>
  <rect x="212" y="362" width="20" height="20" fill="#45E5F5" fill-opacity=".35"/>
  <rect x="70" y="388" width="444" height="16" rx="5" fill="#10485C" fill-opacity=".7" stroke="#45E5F5" stroke-opacity=".6"/>
  <path d="M74 396 h4 v-4 h3 v8 h3 v-6 h3 v4 h3 v-7 h3 v9 h3 v-5 h3 v3 h3 v-6 h3 v8 h3 v-4 h3 v2 h3 v-7 h3 v9 h3 v-5 h3 v4 h3 v-6 h3 v7 h3 v-3 h3 v2 h3 v-6 h3 v8 h3 v-5 h3 v4 h3 v-3" fill="none" stroke="#45E5F5" stroke-opacity=".8" stroke-width="1"/>
  <rect x="300" y="336" width="2" height="72" fill="#FF5C7A"/>
  <path d="M295 336 h12 l-6 7Z" fill="#FF5C7A"/>

  <!-- floating creation chips -->
  <g>
    <rect x="490" y="6" width="130" height="44" rx="14" fill="#121935" stroke="#45E5F5" stroke-opacity=".6"/>
    <path d="M510 20 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5Z" fill="#45E5F5"/>
    <text x="528" y="33" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#F5F7FF">Générer</text>
  </g>
  <g>
    <rect x="0" y="230" width="104" height="40" rx="14" fill="#121935" stroke="#8B5CF6" stroke-opacity=".7"/>
    <rect x="14" y="242" width="20" height="16" rx="4" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <text x="42" y="255" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#F5F7FF">Photo</text>
  </g>

  <!-- SOLVEX mark -->
  <g transform="translate(398 76) scale(.6)">
    <path fill="#F5F7FF" fill-opacity=".9" fill-rule="evenodd" d="M32 3 61 32 32 61 3 32Z M32 15 49 32 32 49 15 32Z"/>
    <path d="M32 19 45 32H19Z" fill="#E2C6FF"/><path d="M19 32H45L32 45Z" fill="#7FA2FF"/>
  </g>
</svg>
