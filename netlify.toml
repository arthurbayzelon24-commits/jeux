# Netlify: connect the GitHub repository, everything else is read from here.
[build]
  command = "node scripts/build-site.js"
  publish = "dist-site"

[build.environment]
  NODE_VERSION = "22"

# Every page of the app is served by index.html (the app routes in the browser).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://image.pollinations.ai; media-src 'self' data: blob:; connect-src 'self' data: blob: https://image.pollinations.ai; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# The service worker and update feed must always be fresh so updates are detected.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/updates/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
